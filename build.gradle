plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.4'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.sonarqube" version "5.1.0.4882"
	id 'jacoco'
}

group = 'com.valecard'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	mavenLocal()
	maven {
		url = "http://nexus-valecard-new.valecard.com.br:8081/repository/maven-public"
		allowInsecureProtocol = true
	}
	maven { url = "https://repository.mulesoft.org/nexus/content/repositories/public/" }
}

sonarqube {
	properties {
		property "sonar.projectName", "ms-cross-cost-center"
		property "sonar.projectKey", "ms-cross-cost-center"
		property "sonar.host.url", "https://sonar.valecard.com.br"
		property "sonar.sourceEncoding", "UTF-8"
		property "sonar.coverage.jacoco.xmlReportPaths", layout.buildDirectory.file("jacoco/test/jacocoTestReport.xml")
		property "sonar.java.coveragePlugin", "jacoco"
		property "sonar.dynamicAnalysis", "reuseReports"
	}
}

dependencies {
	//implementation 'io.github.teastman:spring-data-hibernate-event:1.0.1'

	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

	implementation 'com.oracle:ojdbc6:11.2.0.3'

	// Audit Data Log
	implementation 'com.valecard:lib-audit-log:2.0.0'

	// Vault
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.cloud:spring-cloud-starter-vault-config'
	implementation 'org.springframework.cloud:spring-cloud-vault-config-databases'

	//Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	testImplementation('org.springframework.boot:spring-boot-starter-test') {
		exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
	}
	testImplementation 'org.mockito:mockito-core'
	testImplementation 'junit:junit:4.13.2'
}

ext {
	springCloudVersion = '2024.0.1'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

jacoco {
	toolVersion = "0.8.11"
	reportsDirectory = layout.buildDirectory.dir('reports')
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		csv.required = false
		html.outputLocation.set(layout.buildDirectory.dir('reports/jacoco/html'))
	}
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			element = 'BUNDLE'
			limit {
				counter = 'INSTRUCTION'
				value = 'COVEREDRATIO'
				minimum = 0.5
			}
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
